
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Confirm Transfer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            padding: 20px;
        }
        .confirm-card {
            max-width: 420px;
            margin: 50px auto;
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 5px 25px rgba(0,0,0,.08);
        }
        .amount {
            font-size: 30px;
            color: #087f5b;
            font-weight: bold;
        }
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            margin: 12px 0;
            border: 1px solid #ddd;
            border-radius: 9px;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #087f5b;
            color: white;
            border: none;
            border-radius: 9px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="confirm-card">

    <h2>Confirm Your Transfer</h2>

    <p>You are about to send:</p>

    <div class="amount">
        {{ amount|floatformat:2 }} USDT
    </div>

    <p>
        <strong>Recipient:</strong>
        {{ receiver.username }}
    </p>

    <hr>

    {% if messages %}
        {% for message in messages %}
            <p style="color:red;">{{ message }}</p>
        {% endfor %}
    {% endif %}

    <p>Enter your account password to authorize this transfer.</p>

    <form method="POST" action="{% url 'confirm_internal_transfer' %}">
        {% csrf_token %}

        <input
            type="password"
            name="password"
            placeholder="Your account password"
            autocomplete="current-password"
            required
        >

        <button type="submit">Confirm Transfer</button>
    </form>

    <p style="text-align:center;margin-top:20px;">
        <a href="{% url 'internal_transfer' %}">Cancel</a>
    </p>

</div>

</body>
</html>
