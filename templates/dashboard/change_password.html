
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #020b2d;
            font-family: Arial, sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: #091845;
            padding: 30px;
            border-radius: 22px;
            box-shadow: 0 10px 30px rgba(0,0,0,.5);
        }

        h2 {
            color: #1e90ff;
            text-align: center;
            margin-bottom: 10px;
        }

        .description {
            color: #cfcfcf;
            text-align: center;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin: 16px 0 8px;
            font-size: 14px;
        }

        .password-box {
            position: relative;
        }

        input {
            width: 100%;
            padding: 15px;
            padding-right: 65px;
            border: 1px solid #193576;
            border-radius: 12px;
            background: #10245f;
            color: white;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #1e90ff;
        }

        .toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #1e90ff;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            margin-top: 25px;
            border: none;
            border-radius: 12px;
            background: #00b894;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #009e7d;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #1e90ff;
            text-decoration: none;
        }

        .message {
            padding: 13px;
            margin-bottom: 15px;
            border-radius: 10px;
            text-align: center;
            font-size: 14px;
        }

        .success {
            background: #00b894;
        }

        .error {
            background: #e74c3c;
        }
    </style>
</head>

<body>

<div class="card">

    <h2>🔐 Change Password</h2>

    <p class="description">
        Enter your current password and choose a new secure password.
    </p>

    {% if messages %}
        {% for message in messages %}
            <div class="message {{ message.tags }}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label>Current Password</label>
        <div class="password-box">
            <input type="password"
                   name="current_password"
                   id="current_password"
                   required>
            <button type="button" class="toggle"
                    onclick="togglePassword('current_password', this)">
                SHOW
            </button>
        </div>

        <label>New Password</label>
        <div class="password-box">
            <input type="password"
                   name="new_password"
                   id="new_password"
                   required>
            <button type="button" class="toggle"
                    onclick="togglePassword('new_password', this)">
                SHOW
            </button>
        </div>

        <label>Confirm New Password</label>
        <div class="password-box">
            <input type="password"
                   name="confirm_password"
                   id="confirm_password"
                   required>
            <button type="button" class="toggle"
                    onclick="togglePassword('confirm_password', this)">
                SHOW
            </button>
        </div>

        <button type="submit" class="submit-btn">
            Change Password
        </button>
    </form>

    <a href="{% url 'settings' %}" class="back">
        ← Back to Settings
    </a>

</div>

<script>
    function togglePassword(id, button) {
        const input = document.getElementById(id);

        if (input.type === "password") {
            input.type = "text";
            button.textContent = "HIDE";
        } else {
            input.type = "password";
            button.textContent = "SHOW";
        }
    }
</script>

</body>
</html>
