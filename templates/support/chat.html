<!DOCTYPE html>
<html>
<head>

<title>Support Chat</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,sans-serif;
}

body{
    background:#0f172a;
    height:100vh;
    display:flex;
    flex-direction:column;
}

.header{
    background:#111827;
    color:white;
    padding:20px;
    font-size:22px;
    font-weight:bold;
}

.chat-box{
    flex:1;
    overflow-y:auto;
    padding:20px;
    padding-bottom:180px;
}

.msg{
    max-width:70%;
    padding:12px;
    border-radius:15px;
    margin-bottom:15px;
    word-wrap:break-word;
}

.mine{
    background:#22c55e;
    color:white;
    margin-left:auto;
}

.theirs{
    background:#334155;
    color:white;
}

.msg img{
    width:100%;
    max-width:300px;
    border-radius:10px;
    margin-top:10px;
}

.msg audio{
    width:100%;
    margin-top:10px;
}

.time{
    font-size:12px;
    opacity:.7;
    margin-top:5px;
}

.send-box{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:#111827;
    padding:15px;
}

textarea{
    width:100%;
    height:80px;
    border:none;
    border-radius:10px;
    padding:10px;
    resize:none;
    margin-bottom:10px;
}

.files{
    display:flex;
    gap:10px;
    margin-bottom:10px;
}

button{
    background:#22c55e;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:10px;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

</style>

</head>

<body data-user="{{ request.user.username }}">

<div class="header">
    Support Chat
</div>

<div class="chat-box" id="chatBox">

{% for msg in messages %}

<div class="msg {% if msg.sender == request.user %}mine{% else %}theirs{% endif %}">

    {% if msg.message %}
    <div>{{ msg.message }}</div>
    {% endif %}

    {% if msg.image %}
    <img src="{{ msg.image.url }}">
    {% endif %}

    {% if msg.voice %}
    <audio controls>
        <source src="{{ msg.voice.url }}">
    </audio>
    {% endif %}

    <div class="time">
        {{ msg.created_at|date:"H:i" }}
    </div>

</div>

{% endfor %}

</div>

<div class="send-box">

<form
    id="chatForm"
    enctype="multipart/form-data"
>

{% csrf_token %}

<textarea
    id="messageInput"
    name="message"
    placeholder="Type message..."
></textarea>

<div class="files">

    <input
        type="file"
        name="image"
        accept="image/*"
    >

    <input
        type="file"
        name="voice"
        accept="audio/*"
    >

</div>

<button type="submit">
    Send
</button>

</form>

</div>

<script>


const chat = document.getElementById("chatBox");
const form = document.getElementById("chatForm");
const sendButton = form.querySelector('button[type="submit"]');
const messageInput = document.getElementById("messageInput");

let sending = false;
let loading = false;
let refreshTimer = null;
let lastMessageId = 0;

chat.scrollTop = chat.scrollHeight;

function appendMessage(msg) {
    const wrapper = document.createElement("div");

    wrapper.className =
        msg.sender === document.body.dataset.user
            ? "msg mine"
            : "msg theirs";

    if (msg.message) {
        const text = document.createElement("div");
        text.textContent = msg.message;
        wrapper.appendChild(text);
    }

    if (msg.image) {
        const img = document.createElement("img");
        img.src = msg.image;
        img.alt = "Attached image";
        wrapper.appendChild(img);
    }

    if (msg.voice) {
        const audio = document.createElement("audio");
        audio.controls = true;

        const source = document.createElement("source");
        source.src = msg.voice;

        audio.appendChild(source);
        wrapper.appendChild(audio);
    }

    const time = document.createElement("div");
    time.className = "time";
    time.textContent = msg.time;

    wrapper.appendChild(time);

    return wrapper;
}

async function loadMessages() {
    if (loading) return;

    loading = true;

    try {
        const response = await fetch("messages/", {
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error("Could not load messages.");
        }

        const data = await response.json();

        const nearBottom =
            chat.scrollHeight - chat.scrollTop <=
            chat.clientHeight + 150;

        let htmlChanged = false;

        if (data.length !== lastMessageId + 1 &&
            data.length !== 0) {
            // The server may return older messages too.
            // Rebuild only when the number of messages changes.
            htmlChanged = chat.dataset.messageCount !== String(data.length);
        } else {
            htmlChanged = chat.dataset.messageCount !== String(data.length);
        }

        if (htmlChanged) {
            const fragment = document.createDocumentFragment();

            data.forEach(msg => {
                fragment.appendChild(appendMessage(msg));
            });

            chat.replaceChildren(fragment);
            chat.dataset.messageCount = String(data.length);
        }

        if (data.length) {
            lastMessageId = data[data.length - 1].id;
        }

        if (nearBottom) {
            chat.scrollTop = chat.scrollHeight;
        }

    } catch (error) {
        console.error("Chat refresh error:", error);
    } finally {
        loading = false;
    }
}

async function sendMessage(event) {
    event.preventDefault();

    if (sending) return;

    const formData = new FormData(form);
    const message = (formData.get("message") || "").trim();
    const image = formData.get("image");
    const voice = formData.get("voice");

    if (
        !message &&
        (!image || !image.name) &&
        (!voice || !voice.name)
    ) {
        return;
    }

    sending = true;
    sendButton.disabled = true;
    sendButton.textContent = "Sending...";

    try {
        const response = await fetch("send/", {
            method: "POST",
            body: formData
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.error || "Message could not be sent.");
        }

        form.reset();

        await loadMessages();
        chat.scrollTop = chat.scrollHeight;

    } catch (error) {
        alert(error.message);
    } finally {
        sending = false;
        sendButton.disabled = false;
        sendButton.textContent = "Send";
    }
}

form.addEventListener("submit", sendMessage);

loadMessages();

function scheduleRefresh() {
    clearTimeout(refreshTimer);

    refreshTimer = setTimeout(async () => {
        await loadMessages();
        scheduleRefresh();
    }, 3000);
}

scheduleRefresh();

</script>

</body>
</html>
